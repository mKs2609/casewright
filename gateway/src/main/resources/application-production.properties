# Production settings (step 19a, ADR-54), used only when SPRING_PROFILES_ACTIVE=production, as in
# deploy/compose.yaml. Everything not listed here is the same as application.properties.

# The gateway still speaks only HTTPS, behind the reverse proxy too. Its keystore is made on the
# server at first start (deploy/make-gateway-certificate.sh) and kept in a Docker volume.
server.ssl.key-store=file:/certs/gateway.p12

# The address visitors use, e.g. https://casewright.duckdns.org (from deploy/.env).
security.allowed-origins=${PUBLIC_ORIGIN}

# Every request arrives from the reverse proxy (Caddy), which passes the visitor's address in
# X-Forwarded-For. Believe that header only from Caddy's fixed address on the internal network;
# from anyone else it is ignored. Without this, all visitors would share one rate limit.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=172\\.30\\.0\\.10
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For

# The public demo (step 19b, ADR-55): no sign-up. Visitors use "Try the demo", whose shared analyst
# account fires the fixed scenarios and decides the actions that follow, but cannot submit text of
# its own (only an admin can). A ceiling on demo runs, per address and per day, so nobody can fill
# the disk.
security.signup-enabled=false
demo.public-login.enabled=true
security.incident-submitter-roles=ADMIN
security.rate-limit.demo-runs-per-minute=5
demo.max-runs-per-day=300

# The database address and user (DB_URL, DB_USER) are set by deploy/compose.yaml. The agent shares
# the gateway's network (compose: network_mode), so it is still reached on 127.0.0.1, as in development.

# The log file, which also records the audit chain's latest position (ADR-46), lives in a volume.
logging.file.name=/app/logs/gateway.log
