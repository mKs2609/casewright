spring.application.name=gateway
server.port=8080

# Local development: values come from the .env file in the repo root (never committed).
# Anywhere else: set real environment variables with the same names.
spring.config.import=optional:file:../.env[.properties]

# Database. No defaults on purpose: the app refuses to start without them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Give up waiting for a database connection after 3s (default is 30s), so a
# database outage produces a fast, clear error and not a hanging request.
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema. Hibernate only checks that our Java classes match it,
# and fails startup if they don't. It never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a database connection open while the response is being written.
spring.jpa.open-in-view=false

# Reject request JSON that contains fields we did not ask for
# (stops tricks like sending "role":"ADMIN" along with a signup).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Password hashing with Argon2id. Values are OWASP's recommended minimum:
# 19 MiB of memory, 2 passes, 1 thread. Raise them as hardware gets faster.
security.password.argon2.memory-kib=19456
security.password.argon2.iterations=2
security.password.argon2.parallelism=1

# Access tokens (JWT). The signing key is a secret: 32+ random bytes, Base64-encoded, from .env.
security.jwt.signing-key=${JWT_SIGNING_KEY}
security.jwt.access-token-minutes=15
security.refresh-token-days=7

# Cookies are marked Secure (HTTPS only). Browsers also accept them on http://localhost.
security.cookies.secure=true

# Browser origins allowed to send state-changing requests (defence against cross-site request forgery).
security.allowed-origins=http://localhost:8080,http://localhost:5173
