spring.application.name=gateway

# The gateway only speaks HTTPS. Port 8443 is the usual port for HTTPS during development.
server.port=8443
# The certificate and its private key, in a password-protected keystore file.
# scripts/setup-https.ps1 creates it in certs/ (never committed). Paths are relative to gateway/.
server.ssl.key-store=file:../certs/gateway-dev.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=gateway
# Only modern TLS versions; TLS 1.0 and 1.1 are broken and refused.
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Local development: values come from the .env file in the repo root (never committed).
# Anywhere else: set real environment variables with the same names.
spring.config.import=optional:file:../.env[.properties]

# Database. No defaults on purpose: the app refuses to start without them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Give up waiting for a database connection after 3s (default is 30s), so a
# database outage produces a fast, clear error and not a hanging request.
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema. Hibernate only checks that our Java classes match it,
# and fails startup if they don't. It never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a database connection open while the response is being written.
spring.jpa.open-in-view=false

# Reject request JSON that contains fields we did not ask for
# (stops tricks like sending "role":"ADMIN" along with a signup).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Password hashing with Argon2id. Values are OWASP's recommended minimum:
# 19 MiB of memory, 2 passes, 1 thread. Raise them as hardware gets faster.
security.password.argon2.memory-kib=19456
security.password.argon2.iterations=2
security.password.argon2.parallelism=1

# Access tokens (JWT). The signing key is a secret: 32+ random bytes, Base64-encoded, from .env.
security.jwt.signing-key=${JWT_SIGNING_KEY}
security.jwt.access-token-minutes=15
security.refresh-token-days=7

# Cookies are marked Secure: the browser only ever sends them over HTTPS.
security.cookies.secure=true

# Browser origins allowed to send state-changing requests (defence against cross-site request forgery).
# Both are HTTPS: the gateway itself, and the dashboard's development server (step 16).
security.allowed-origins=https://localhost:8443,https://localhost:5173

# Rate limits (ADR-12). Exceeding one gives 429 with a Retry-After header.
# Any request, per client IP address:
security.rate-limit.requests-per-minute=120
# Login and signup, per client IP address (they run the slow password hash):
security.rate-limit.credential-requests-per-minute=10
# Per username: this many login attempts freely, then each further attempt waits
# 1s, 2s, 4s, ... up to the maximum. A correct password resets it. No permanent lockout.
security.rate-limit.free-login-attempts=5
security.rate-limit.max-login-backoff=15m
security.rate-limit.forget-login-attempts-after=1h
# Most IP addresses / usernames remembered at once, so a flood of made-up ones can't fill the memory.
security.rate-limit.max-tracked-clients=100000

# Largest request body accepted. Anything bigger is refused with 413 before it is read.
security.max-request-size=256KB

# Every log line shows the trace ID of the request it belongs to.
logging.pattern.level=%5p [trace=%X{traceId:-none}]

# Never show Spring's built-in HTML error page; errors are always our JSON.
server.error.whitelabel.enabled=false
