# Continuous integration: GitHub runs the test suite on a fresh Linux machine
# for every pull request and every push to main, and reports pass or fail.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'  # every Monday 03:30 UTC, so a vulnerability published after a merge is still noticed
  workflow_dispatch:    # adds a "Run workflow" button on the Actions tab

# The workflow may only read the repository. It cannot push, comment or change
# settings, so even a malicious change to a pull request cannot misuse it.
permissions:
  contents: read

# If a newer commit is pushed to the same branch, cancel the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: Gateway tests          # the name branch protection asks for
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway

    steps:
      # Actions are pinned to an exact commit (the long hex) rather than a movable
      # tag such as v7, so a compromised or re-tagged action cannot change what runs
      # here. The comment says which release that commit is.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # don't leave the access token on the machine

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven                 # reuse downloaded libraries between runs

      - name: Run all tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-test-reports
          path: gateway/target/surefire-reports/
          retention-days: 7

  agent-tests:
    name: Agent tests            # the name branch protection asks for
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip                   # reuse downloaded packages between runs
          cache-dependency-path: agent/requirements-dev.txt

      # Every package, including indirect ones, is pinned to an exact version and to the SHA-256 of
      # its files. --require-hashes makes pip refuse anything without a matching fingerprint.
      - name: Install the pinned packages
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements-dev.txt

      - name: Run all tests
        run: python -m pytest

  dashboard-tests:
    name: Dashboard tests        # the name branch protection asks for
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm                   # reuse downloaded packages between runs
          cache-dependency-path: dashboard/package-lock.json

      # npm ci installs exactly what the lockfile says, and fails if it doesn't match package.json.
      - name: Install the pinned packages
        run: npm ci

      - name: Run all tests
        run: npm test

      # Includes the type check. Needs no certificate: only the local servers do.
      - name: Check that it builds
        run: npm run build

  # --------------------------------------------------------------- the containers (step 19a, ADR-54)
  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fresh random secrets for this run only, exactly as on the server; "localhost" makes Caddy
      # use its own small certificate authority instead of Let's Encrypt.
      - name: Make throwaway secrets
        run: sh deploy/make-secrets.sh localhost

      - name: Build the images and start everything
        run: docker compose -f deploy/compose.yaml up --detach --build

      - name: Use it like a visitor, and check the walls between the containers
        run: bash deploy/smoke-test.sh

      - name: Show the containers' logs if something failed
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --timestamps

      - name: Stop and remove everything
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes

  # --------------------------------------------------------------- security checks (step 18a, ADR-52)
  # The scanners below are downloaded from their official releases and refused unless their SHA-256
  # matches the one written here: a pinned version, checked before anything runs.

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get OSV-Scanner v2.7.0 and check it
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      # Every library of all three parts, against the OSV vulnerability database. For pom.xml the
      # scanner works out the indirect libraries too. Any known vulnerability fails the job.
      - name: Check every library for known vulnerabilities
        run: >-
          ./osv-scanner scan source
          --lockfile=gateway/pom.xml
          --lockfile=agent/requirements.txt
          --lockfile=agent/requirements-dev.txt
          --lockfile=dashboard/package-lock.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub's own check of what a pull request adds or changes: a new or updated package with a
      # known vulnerability of moderate severity or worse fails it.
      - name: Review the changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code, with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # every commit, not just the latest
          persist-credentials: false

      - name: Get gitleaks v8.30.1 and check it
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      # Every commit ever made, not only this change: a secret deleted later is still in the history.
      # --redact keeps anything found out of the log.
      - name: Look for secrets in the whole history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
