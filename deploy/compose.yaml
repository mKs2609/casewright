# The whole system on one server (step 19a, ADR-54). From the repository root:
#   sh deploy/make-secrets.sh casewright.duckdns.org     once: creates deploy/.env
#   docker compose -f deploy/compose.yaml up -d --build   build the images and start everything
# Values like ${DB_PASSWORD} come from deploy/.env, which compose reads by itself.
#
# Who can reach whom:
#   internet -> caddy (80, 443) -> gateway (8443, HTTPS) -> agent (127.0.0.1:8001, shared network)
#                                          \-> db (5432)
# Only caddy has ports open to the outside. The gateway, agent and database are on internal
# networks with no way out to the internet at all.

name: secanalyst

x-hardened: &hardened
  # No special Linux rights, and no way to gain any (for example through a setuid program).
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-gateway-build: &gateway-build
  context: ..
  dockerfile: gateway/Dockerfile

services:

  db:
    <<: *hardened
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    # The postgres image starts as root to set up its folder, then switches to its own user;
    # these are the only rights that needs.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in deploy/.env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?missing in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
      - ../scripts/setup-db.sql:/setup-db.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname secanalyst"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Runs once at first start, then stops: makes the gateway's own certificate (make-gateway-certificate.sh).
  gateway-certificate:
    <<: *hardened
    restart: "no"
    build: *gateway-build
    image: secanalyst-gateway
    entrypoint: ["sh", "/app/make-gateway-certificate.sh"]
    environment:
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?missing in deploy/.env}
    volumes:
      - gateway-keystore:/certs
      - gateway-ca:/gateway-ca
    network_mode: none

  gateway:
    <<: *hardened
    build: *gateway-build
    image: secanalyst-gateway
    depends_on:
      db: {condition: service_healthy}
      gateway-certificate: {condition: service_completed_successfully}
    environment:
      DB_URL: jdbc:postgresql://db:5432/secanalyst
      DB_USER: secanalyst_app
      DB_PASSWORD: ${DB_PASSWORD:?missing in deploy/.env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?missing in deploy/.env}
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?missing in deploy/.env}
      BASELINE_ENCRYPTION_KEY: ${BASELINE_ENCRYPTION_KEY:?missing in deploy/.env}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?missing in deploy/.env}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?missing in deploy/.env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?missing in deploy/.env}
    volumes:
      - gateway-keystore:/certs:ro
      - gateway-logs:/app/logs
    # Its files cannot be changed while it runs; only /tmp and the log volume are writable.
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, data]

  agent:
    <<: *hardened
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: secanalyst-agent
    depends_on: [gateway]
    # Shares the gateway's network: it listens on 127.0.0.1 there, so only the gateway can reach
    # it, exactly as on a development machine (ADR-4). It inherits the gateway's lack of internet.
    network_mode: "service:gateway"
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?missing in deploy/.env}
      # No AI model on the server (ADR-54): the fixed plan, as measured in docs/EVALUATION.md.
      LLM_PROVIDER: "off"
    read_only: true
    tmpfs: [/tmp]

  caddy:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    image: secanalyst-web
    depends_on:
      gateway: {condition: service_started}
      gateway-certificate: {condition: service_completed_successfully}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?missing in deploy/.env}
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - gateway-ca:/gateway-ca:ro
    read_only: true
    tmpfs: [/tmp]
    networks:
      public: {}
      # A fixed address: the only one the gateway believes about a visitor's address
      # (server.tomcat.remoteip.internal-proxies in application-production.properties).
      edge: {ipv4_address: 172.30.0.10}

networks:
  # Caddy's way in from, and out to, the internet (Let's Encrypt).
  public: {}
  # Caddy to the gateway. Internal: nothing on it can reach the internet.
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # The gateway to the database. Internal too.
  data:
    internal: true

volumes:
  db-data: {}
  gateway-keystore: {}
  gateway-ca: {}
  gateway-logs: {}
  caddy-data: {}
  caddy-config: {}
